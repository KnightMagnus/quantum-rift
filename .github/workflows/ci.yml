name: CI

on:
  push:
    branches: [main, configure_prettier_husky_git_lfs, 'refactor/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Lint, Format, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Git LFS objects
        run: |
          git lfs version
          git lfs ls-files
          git lfs fsck
          node -e 'const fs = require("fs"); const s = fs.statSync("client/assets/hub.png"); if (s.size < 10000) throw new Error("LFS pointer not resolved: " + s.size);'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Feature parity test
        run: npm run test:features

      - name: Contract types test
        run: npm run test:types

      - name: Complete server and gameplay regression inventory
        run: npm run test:regression:unit

      - name: Preserve server regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-regression-evidence
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7

  browser-regressions:
    name: Browser gameplay and client regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Durable browser regression suite
        run: npm run test:regression:browser
      - name: Preserve browser evidence and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7

  windows-startup:
    name: Native Windows persistence and startup
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Windows online and Solo startup regression
        run: node test/persistence-platform.mjs
      - name: Preserve Windows startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-evidence
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7
