name: CI

on:
  push:
    branches: [main, configure_prettier_husky_git_lfs, 'refactor/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Lint, Format, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Git LFS objects
        run: |
          git lfs version
          git lfs ls-files
          git lfs fsck
          node -e 'const fs = require("fs"); const s = fs.statSync("client/assets/hub.png"); if (s.size < 10000) throw new Error("LFS pointer not resolved: " + s.size);'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Feature parity test
        run: npm run test:features

      - name: Contract types test
        run: npm run test:types
