name: CI

on:
  push:
    branches: [main, configure_prettier_husky_git_lfs, 'refactor/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Lint, Format, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Git LFS objects
        run: |
          git lfs version
          git lfs ls-files
          git lfs fsck
          node -e 'const fs = require("fs"); const s = fs.statSync("client/assets/hub.png"); if (s.size < 10000) throw new Error("LFS pointer not resolved: " + s.size);'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Feature parity test
        run: npm run test:features

      - name: Contract types test
        run: npm run test:types

      - name: Communications, equipment and passenger regressions
        run: |
          node test/landing-autopilot.js
          node test/faction-standing.js
          node test/gateway-navigation.js
          node test/eventide.js
          node test/companion-fixes.js
          node test/hailing.js
          node test/chat-bubbles.js
          node test/original-weapons.js
          node test/combat-assist.js
          node test/comet.js
          node test/ship-economy.js
          node test/passengers.js
          node test/outfitter-icons.js
          node test/catalog-artwork.js
          node test/ship-banking.js
          node test/animation-frames.js
          node test/wormhole-loop.js
          node test/stars.js
          node test/background-scale.js
          node test/passenger-quests.js
          node test/local-retaliation.js
          node test/main-map-protection.js
          node test/outfitter-wing-repairs.js
          node test/fuzz.js
