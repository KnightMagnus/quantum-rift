name: CI

on:
  push:
    branches: [main, configure_prettier_husky_git_lfs, 'refactor/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, Format, Types and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Git LFS objects
        run: |
          git lfs version
          git lfs ls-files
          git lfs fsck
          node -e 'const fs = require("fs"); const s = fs.statSync("client/assets/hub.png"); if (s.size < 10000) throw new Error("LFS pointer not resolved: " + s.size);'

      - name: Bootstrap native TypeScript support
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project-local Node 27 nightly
        run: node tools/runtime/install-node.ts

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Oxfmt
        run: npm run format:check

      - name: Lint TypeScript application, tests and tooling with Oxlint
        run: npm run lint

      - name: Strict typecheck of application, tests and tools
        run: npm run typecheck

      - name: Feature parity test
        run: npm run test:features

      - name: Contract types test
        run: npm run test:types

  unit-regressions:
    name: Server regressions (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Bootstrap native TypeScript support
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project-local Node 27 nightly
        run: node tools/runtime/install-node.ts
      - run: npm ci
      - name: Set up Python for Solo save generator regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare pinned native Nakama and PostgreSQL test binaries
        run: |
          node tools/runtime/install-nakama.ts
          echo "POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          test -x "$(pg_config --bindir)/initdb"

      - name: Install pinned procedural landscape dependencies
        run: python -m pip install -r tools/landscape-requirements.txt

      - name: Complete server and gameplay regression inventory
        run: npm run test:regression:unit -- --shard=${{ matrix.shard }}/4

      - name: Preserve server regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-regression-evidence-${{ matrix.shard }}
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: Lint, Format, Types & Tests
    needs: [quality, unit-regressions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality checks and server shards
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          REGRESSION_RESULT: ${{ needs.unit-regressions.result }}
        run: test "$QUALITY_RESULT" = success && test "$REGRESSION_RESULT" = success

  browser-shards:
    name: Browser regressions (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Allow cold browser installation plus the full flight and station sweeps.
    # Individual regression subprocesses retain their strict 180s deadlines.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Bootstrap native TypeScript support
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project-local Node 27 nightly
        run: node tools/runtime/install-node.ts
      - run: npm ci
      - name: Install pinned Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Set up Python for Solo save import fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned native Nakama and PostgreSQL test binaries
        run: |
          node tools/runtime/install-nakama.ts
          echo "POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
          test -x "$(pg_config --bindir)/initdb"

      - name: Durable browser regression suite
        run: npm run test:regression:browser -- --shard=${{ matrix.shard }}/4
      - name: Preserve browser evidence and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence-${{ matrix.shard }}
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7

  browser-regressions:
    name: Browser gameplay and client regressions
    needs: [browser-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          REGRESSION_RESULT: ${{ needs.browser-shards.result }}
        run: test "$REGRESSION_RESULT" = success

  windows-startup:
    name: Native Windows persistence and startup
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap native TypeScript support
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project-local Node 27 nightly
        run: node tools/runtime/install-node.ts
      # The pinned npm release has no Windows binary. Build the same release,
      # not another checker, and let its launcher use TSRS_BINARY.
      - name: Checkout pinned native Rust compiler source
        uses: actions/checkout@v4
        with:
          repository: oxc-project/tsrs
          ref: 5f92808bc92bb97b06212153ab73d28d551c0b9b
          path: .artifacts/tsrs-source
          persist-credentials: false
      - name: Cache native Windows compiler build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .artifacts/tsrs-source/target
          key: windows-tsrs-5f92808bc92bb97b06212153ab73d28d551c0b9b-rust-1.99.1
      - name: Build pinned tsrs for native Windows
        shell: pwsh
        env:
          TSRS_TS_VERSION: 7.1.0-dev.20260930.4
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 build --manifest-path .artifacts/tsrs-source/Cargo.toml --profile ci --locked -p tsrs_cli --bin tsrs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (Resolve-Path .artifacts/tsrs-source/target/ci/tsrs.exe).Path
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TSRS_BINARY=$compiler" >> $env:GITHUB_ENV
      - name: Install and compile browser modules
        run: npm ci
      - name: Windows Oxc and native Rust type checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:types
          npm run test:tooling
          npm run test:features
      - name: Windows online and Solo startup regression
        run: node test/persistence-platform.ts
      - name: Preserve Windows startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-evidence
          path: .artifacts/regression/
          if-no-files-found: warn
          retention-days: 7

  save-generator-windows:
    name: Windows save generator build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native Tk window
        run: python -c "import tkinter as tk; window=tk.Tk(); window.update(); window.destroy()"
      - name: Build standalone EXE
        working-directory: test/Save Generator
        run: |
          python -m pip install -r tools/save-generator-requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Quantum Rift Save Generator" --add-data "catalog.json;." save_generator.py
      - name: Verify packaged EXE creates a custom save
        run: |
          python - <<'PYTHON'
          import json, pathlib, subprocess, tempfile
          executable = pathlib.Path('test/Save Generator/dist/Quantum Rift Save Generator.exe').resolve()
          with tempfile.TemporaryDirectory() as scratch:
              output = pathlib.Path(scratch) / 'captain.rift.json'
              subprocess.run([str(executable), '--output', str(output), '--name', 'Windows Captain', '--credits', '456789', '--ship', '736', '--tier', '5'], check=True, timeout=60)
              saved = json.loads(output.read_text())['save']
              assert saved['name'] == 'Windows Captain' and saved['credits'] == 456789
              assert saved['ship']['hull'] == 736 and saved['station']['ops'] == 5
          PYTHON
      - name: Preserve standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: quantum-rift-save-generator-windows
          path: test/Save Generator/dist/Quantum Rift Save Generator.exe
          if-no-files-found: error
          retention-days: 7

  release-archive:
    name: Build hashed release archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/runtime/install-node.ts
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build clean complete archive and manifest
        run: python tools/package_archive.py --complete-only --output .artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7

  archive-smoke:
    name: Extracted release (${{ matrix.os }})
    needs: [release-archive]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/runtime/install-node.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: .artifacts/release
      - name: Verify exact archive and run without npm dependencies
        run: |
          mkdir -p .artifacts/temp
          export TMPDIR="$(node -p 'require("path").resolve(".artifacts/temp")')"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          export RIFT_RELEASE_MANIFEST="$(node -p 'require("path").resolve(".artifacts/release/package-manifest.json")')"
          export RIFT_RELEASE_ARCHIVE="$(node -e 'const p=require("path"),f=require("fs");process.stdout.write(p.join(p.dirname(process.env.RIFT_RELEASE_MANIFEST),JSON.parse(f.readFileSync(process.env.RIFT_RELEASE_MANIFEST)).archives[0].name))')"
          node test/release-archive-smoke.ts
      - name: Preserve hashed archive runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-evidence-${{ matrix.os }}
          path: .artifacts/regression/release-archive/
          if-no-files-found: error
          retention-days: 7

  platform-browser-smoke:
    name: Browser engine smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/playwright
      RIFT_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/runtime/install-node.ts
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node test/platform-browser-smoke.ts
      - name: Preserve engine smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-browser-evidence-${{ matrix.engine }}
          path: .artifacts/regression/
          if-no-files-found: error
          retention-days: 7

  release-readiness:
    name: Release readiness
    needs:
      [
        quality,
        unit-regressions,
        browser-regressions,
        windows-startup,
        save-generator-windows,
        platform-browser-smoke,
        archive-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/runtime/install-node.ts
      - name: Require all supported lanes on this commit
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node tools/release-readiness.ts
      - name: Preserve readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness
          path: .artifacts/release-readiness.json
          if-no-files-found: error
          retention-days: 7
